# Configured with OpenSpec 1.14.0; the CLI is a development tool, not a product dependency.
schema: spec-driven

context: |
  Language: English. Write every OpenSpec artifact in English.
  Paths below are relative to the repository root.

  env-vault is the owner's personal Go CLI that injects secrets into a child
  process's environment. Go 1.26.8 (go.mod), Cobra, yaml.v3; macOS, Linux and
  Windows. cmd/env-vault is the entry point; internal/cli holds the commands;
  config: YAML and locking; secretstore: backend interface; runner: processes
  and signals; output: human/JSON/JSONL; atomicfile: file publication;
  bundle: encrypted transfer.

  openspec/specs/ is the normative description of current behavior:
  cli-output, secret-storage, profile-config, exec, secret-transfer,
  release-process and homebrew-distribution. docs/design.md covers
  architecture and rationale; README.md is the user guide;
  openspec/open-questions.md lists known gaps not yet decided.
  Compatibility contracts: config YAML v1, env-vault.bundle.v1 and import of
  v0.4.2 containers, output formats, exit codes and platform exec behavior.
  Change them only explicitly, through a proposal and verifiable delta specs.

  Rules, security and authority: AGENTS.md and docs/security.md. Decisions:
  docs/adr/0001-secret-backend.md,
  docs/adr/0010-encrypted-secret-transfer-container.md,
  docs/adr/0011-minimal-release-pipeline.md,
  docs/adr/0012-attestation-verification-pins-release-workflow.md,
  docs/adr/0013-owner-benefit-scope.md. Priorities: backlog.md.
  This context is a short index; general rules stay in AGENTS.md,
  architectural decisions in ADRs, and a change's requirements in its specs.
  Examples use synthetic metadata; test secrets are generated at runtime with
  internal/testutil and never printed in diagnostics.

  Select checks by change from CONTRIBUTING.md:
  git diff --check; GOTOOLCHAIN=go1.26.8 go mod tidy -diff;
  GOTOOLCHAIN=go1.26.8 go mod verify; GOTOOLCHAIN=go1.26.8 go test ./...;
  GOTOOLCHAIN=go1.26.8 go vet ./...; GOTOOLCHAIN=go1.26.8 go test -race ./...;
  GOTOOLCHAIN=go1.26.8 scripts/smoke.sh; GOTOOLCHAIN=go1.26.8 scripts/vuln-check.sh;
  GOTOOLCHAIN=go1.26.8 scripts/license-check.sh; openspec validate --specs --strict.
  E2E: docs/e2e.md. A local run does not establish native behavior on other
  operating systems.

rules:
  proposal:
    - Justify the change by a concrete benefit to the owner or a demonstrated risk; separate facts from assumptions.
  specs:
    - Describe observable behavior; every requirement has a concrete, verifiable scenario.
  design:
    - Record the chosen solution, compatibility boundaries, alternatives and open questions.
  tasks:
    - Every task has a verifiable outcome; link the implementation to its tests and documentation.
