name: reusable-quality

on:
  workflow_call:

permissions:
  contents: read

# Tests execute the triggering commit. Deny cache access at the job-token layer,
# including manual runs; setup-go cache switches alone do not enforce this.
cache-mode: none

jobs:
  resolve:
    name: resolve-source-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A partial rerun preserves a successful resolve job and its outputs.
    # Consumers must use these uploaded IDs, not the consumer's run_attempt.
    outputs:
      linux-amd64-artifact-id: ${{ steps.reporter-linux-amd64.outputs.artifact-id }}
      darwin-arm64-artifact-id: ${{ steps.reporter-darwin-arm64.outputs.artifact-id }}
      windows-amd64-artifact-id: ${{ steps.reporter-windows-amd64.outputs.artifact-id }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: |
            go.sum
            tools/e2e-reporter/go.sum

      # E2E runs once per operating system, so only these three targets need
      # a reporter.
      - name: Build exact E2E reporter bundle once
        shell: bash
        run: |
          set -euo pipefail
          targets="$RUNNER_TEMP/env-vault-e2e-targets.json"
          jq -n '{include: [
            {id: "linux-amd64", goos: "linux", goarch: "amd64"},
            {id: "darwin-arm64", goos: "darwin", goarch: "arm64"},
            {id: "windows-amd64", goos: "windows", goarch: "amd64"}
          ]}' > "$targets"
          scripts/release/build-e2e-reporters.sh "$targets" reporter-tools

      - name: Upload linux-amd64 current-attempt E2E reporter
        id: reporter-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-vault-tooling-gotestsum-linux-amd64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: reporter-tools/linux-amd64
          if-no-files-found: error
          retention-days: 14

      - name: Upload darwin-arm64 current-attempt E2E reporter
        id: reporter-darwin-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-vault-tooling-gotestsum-darwin-arm64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: reporter-tools/darwin-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Upload windows-amd64 current-attempt E2E reporter
        id: reporter-windows-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-vault-tooling-gotestsum-windows-amd64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: reporter-tools/windows-amd64
          if-no-files-found: error
          retention-days: 14

  source-quality:
    name: source-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require tidy module files
        run: go mod tidy -diff

      - name: Verify module cache
        run: go mod verify

      - name: Run source tests
        run: go test ./...

      - name: Vet source
        run: go vet ./...

      - name: Check reachable vulnerabilities
        run: scripts/vuln-check.sh

      - name: Run source smoke tests
        run: scripts/smoke.sh

      - name: Run full race suite
        run: go test -race ./...

      - name: Verify pinned historical transfer
        run: scripts/historical-transfer.sh

      - name: Verify isolated Debian Secret Service
        run: scripts/secret-service-ci.sh

  license:
    name: license-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-15
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check dependency licenses
        shell: bash
        run: scripts/license-check.sh

  native:
    needs: [resolve]
    name: artifact-quality-${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      # ADR 0011: E2E runs once per operating system; build and smoke cover
      # all five targets.
      E2E: ${{ matrix.id == 'linux-amd64' || matrix.id == 'darwin-arm64' || matrix.id == 'windows-amd64' }}
      REPORTER_ARTIFACT_ID: ${{ needs.resolve.outputs[format('{0}-artifact-id', matrix.id)] }}
    # The five release targets. release.yml builds the same ones, and
    # tests/workflows_test.go keeps the two lists equal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            binary: env-vault
            archive: env-vault-linux-amd64.tar.gz
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
            binary: env-vault
            archive: env-vault-linux-arm64.tar.gz
          - id: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
            binary: env-vault
            archive: env-vault-darwin-amd64.tar.gz
          - id: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            binary: env-vault
            archive: env-vault-darwin-arm64.tar.gz
          - id: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            binary: env-vault.exe
            archive: env-vault-windows-amd64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run native platform config tests
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -v ./internal/config -count=1

      - name: Run native internal tests
        if: matrix.id == 'darwin-arm64' || matrix.id == 'windows-amd64'
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          ENV_VAULT_NATIVE_WINCRED_TEST: ${{ matrix.goos == 'windows' && '1' || '' }}
        run: |
          set -euo pipefail
          go test ./internal/... -count=1 -timeout=5m -json | python3 scripts/check-native-tests.py

      - name: Burn in Windows config concurrency
        if: matrix.goos == 'windows'
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test ./internal/config -run '^TestConcurrentSavePublishesOnlyCompleteConfigs$' -count=10

      - name: Build native release artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          name="env-vault-${GOOS}-${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags="-s -w" -o "dist/${name}/${BINARY}" ./cmd/env-vault
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/${name}/"

      - name: Package native release artifact on Unix
        if: env.E2E == 'true' && runner.os != 'Windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          CHECKSUM: ${{ matrix.archive }}.sha256
        run: |
          set -euo pipefail
          name="env-vault-${GOOS}-${GOARCH}"
          cd dist
          tar -czf "$ARCHIVE" "$name"
          shasum -a 256 "$ARCHIVE" > "$CHECKSUM"

      - name: Package native release artifact on Windows
        if: env.E2E == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          CHECKSUM: ${{ matrix.archive }}.sha256
        run: |
          $ErrorActionPreference = "Stop"
          $name = "env-vault-$env:GOOS-$env:GOARCH"
          $archive = Join-Path "dist" $env:ARCHIVE
          Compress-Archive -LiteralPath (Join-Path "dist" $name) -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path "dist" $env:CHECKSUM
          [System.IO.File]::WriteAllText($checksum, "$hash  $env:ARCHIVE`n", [System.Text.Encoding]::ASCII)

      - name: Require the resolved E2E reporter
        if: env.E2E == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # An empty artifact-ids input means "download all", so fail first.
          [[ "$REPORTER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "resolve did not provide one reporter artifact ID" >&2
            exit 1
          }

      - name: Download exact resolved E2E reporter
        if: env.E2E == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Without a github-token override the action reads this run only.
          artifact-ids: ${{ env.REPORTER_ARTIFACT_ID }}
          path: reporter-tool

      - name: Run E2E and finalize reports
        if: env.E2E == 'true'
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          ENV_VAULT_E2E_GOOS: ${{ matrix.goos }}
          ENV_VAULT_E2E_GOARCH: ${{ matrix.goarch }}
          ENV_VAULT_E2E_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          reporter_name=gotestsum
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            reporter_name=gotestsum.exe
          fi
          reporter="reporter-tool/$reporter_name"
          if [[ -f "$reporter" && ! -L "$reporter" ]]; then
            chmod 0755 "$reporter"
          fi
          export GOPROXY=off
          go run ./e2e/cmd/e2e-runner run \
            --phase candidate \
            --coverage-floor 60 \
            --command-timeout 3m \
            --test-timeout 5m \
            --artifact "dist/${{ matrix.archive }}" \
            --checksum "dist/${{ matrix.archive }}.sha256" \
            --reporter "$reporter" \
            --reporter-checksum "$reporter.sha256"

      # E2E runs on the gated test backend; this runs the release binary
      # against the platform's real secret store.
      - name: Smoke-test the real OS secret store
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          BINARY_PATH: dist/env-vault-${{ matrix.goos }}-${{ matrix.goarch }}/${{ matrix.binary }}
          # Without a session bus the keyring library would start one per call.
          DBUS_SESSION_BUS_ADDRESS: ${{ matrix.goos == 'linux' && 'disabled:' || '' }}
        run: |
          set -euo pipefail
          if [[ "$GOOS" == "linux" ]] && ! command -v pass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends pass
          fi
          scripts/backend-smoke.sh "$BINARY_PATH"

      - name: Upload current-attempt E2E reports
        if: always() && env.E2E == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-vault-e2e-candidate-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: reports/e2e/candidate
          if-no-files-found: error
          retention-days: 30

  e2e-gate:
    if: always() && !cancelled()
    needs: [resolve, source-quality, license, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every upstream quality stage
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          SOURCE_QUALITY_RESULT: ${{ needs.source-quality.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          for result in "$RESOLVE_RESULT" "$SOURCE_QUALITY_RESULT" "$LICENSE_RESULT" "$NATIVE_RESULT"; do
            [[ "$result" == "success" ]] || {
              echo "quality stage result: $result" >&2
              exit 1
            }
          done
