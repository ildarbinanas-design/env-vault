name: release

# ADR 0011 and ADR 0012. On every push to main, Release Please maintains the
# release pull request. When that pull request merges, Release Please tags the
# merge commit and opens a draft release, and the run for that commit builds,
# packages, attests and publishes it, verifies the published release, and opens
# the Homebrew tap pull request. Pull requests that change the release path
# build and package without publishing.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/package-archives.sh
      - scripts/release/package-release.sh
      - scripts/release/homebrew-formula.sh
      - scripts/backend-smoke.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Runs are never cancelled, because a release may already have its tag and
  # draft. They queue instead of replacing each other.
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-planning
    outputs:
      release: ${{ steps.find.outputs.release }}
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      # A pull request opened with GITHUB_TOKEN would not trigger the required
      # checks, so Release Please uses the planning token.
      - name: Maintain the release pull request and create the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLANNING_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      # Runs are not strictly ordered, so the run that created the draft may
      # belong to another commit. Only the run for the tagged commit builds, so
      # its attestations name exactly the released commit.
      - id: find
        name: Find a draft release for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLANNING_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -er '."."' .release-please-manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "manifest version '$version' is invalid" >&2; exit 1; }
          tag="v$version"
          tagged="$(git ls-remote origin "refs/tags/$tag" | awk '{ print $1 }')"
          release=false
          if [[ "$tagged" == "$GITHUB_SHA" ]]; then
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" ||
              { echo "tag $tag points to this commit, but its release cannot be read" >&2; exit 1; }
            if [[ "$draft" == "true" ]]; then
              release=true
            else
              echo "release $tag is already published"
            fi
          fi
          {
            printf 'release=%s\n' "$release"
            printf 'tag=%s\n' "$tag"
            printf 'sha=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "draft release for this commit: $release ($tag)"

  build:
    name: build-${{ matrix.id }}
    needs: [release-please]
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release-please.outputs.release == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      RELEASE: ${{ needs.release-please.outputs.release == 'true' }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            binary: env-vault
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
            binary: env-vault
          - id: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
            binary: env-vault
          - id: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            binary: env-vault
          - id: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            binary: env-vault.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history with tags, so Go stamps the tag's version into the binary.
          fetch-depth: "0"
          persist-credentials: "false"

      - name: Check that the tag points to this commit
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "invalid release tag '$RELEASE_TAG' or commit '$RELEASE_SHA'" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] ||
            { echo "checked out $(git rev-parse HEAD), expected $RELEASE_SHA" >&2; exit 1; }
          tagged="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}")" ||
            { echo "tag $RELEASE_TAG does not exist" >&2; exit 1; }
          [[ "$tagged" == "$RELEASE_SHA" ]] ||
            { echo "tag $RELEASE_TAG points to $tagged, not the release commit $RELEASE_SHA" >&2; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: "false"

      - name: Build and check the build information
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          TARGET: ${{ matrix.id }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          # Build outside the checkout: an untracked file in it would mark the
          # build information as modified.
          temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          binary="$temp/release/$TARGET/$BINARY"
          mkdir -p "$(dirname "$binary")"
          go build -trimpath -ldflags="-s -w" -o "$binary" ./cmd/env-vault
          info="$(go version -m "$binary")"
          printf '%s\n' "$info"
          modified="$(awk '$1 == "build" && $2 ~ /^vcs\.modified=/ { print substr($2, 14); exit }' <<< "$info")"
          [[ -n "$modified" ]] || { echo "build information has no VCS stamp" >&2; exit 1; }
          [[ "$modified" == "false" ]] || { echo "build information reports a modified tree" >&2; exit 1; }
          module_version="$(awk '$1 == "mod" { print $3; exit }' <<< "$info")"
          reported="$("$binary" --version | awk '{ print $1; exit }')"
          [[ -n "$module_version" && "$reported" == "$module_version" ]] ||
            { echo "--version reports '$reported', build information has '$module_version'" >&2; exit 1; }
          if [[ "$RELEASE" == "true" ]]; then
            [[ "$module_version" == "$RELEASE_TAG" ]] ||
              { echo "build information has '$module_version', the release is '$RELEASE_TAG'" >&2; exit 1; }
          fi

      # Upload before the smoke test runs anything, so the attested bytes are
      # the bytes the build produced.
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.id }}
          path: ${{ runner.temp }}/release/${{ matrix.id }}/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test the real OS secret store
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          TARGET: ${{ matrix.id }}
          BINARY: ${{ matrix.binary }}
          # Without a session bus the keyring library would start one per call.
          DBUS_SESSION_BUS_ADDRESS: ${{ matrix.goos == 'linux' && 'disabled:' || '' }}
        run: |
          set -euo pipefail
          if [[ "$GOOS" == "linux" ]] && ! command -v pass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends pass
          fi
          temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          scripts/backend-smoke.sh "$temp/release/$TARGET/$BINARY"

  # Pull requests and manual runs stop after packaging. release-please is
  # skipped on them, and a skipped job anywhere up the chain skips every later
  # job without a status function, so this job checks build itself.
  package:
    name: package
    needs: [build]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/downloads

      - name: Package deterministically
        shell: bash
        run: scripts/release/package-release.sh "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/archives"

      # A release runs these checks only after its tag exists, so a pull
      # request confirms first that the runner's gh still has every flag the
      # publish and verify jobs use (ADR 0012).
      - name: Check the attestation verifier's flags
        shell: bash
        run: |
          set -euo pipefail
          gh --version | sed -n 1p
          help="$(gh attestation verify --help)"
          for flag in --repo --signer-workflow --source-ref --source-digest --deny-self-hosted-runners; do
            grep -qe "$flag" <<< "$help" || { echo "gh attestation verify has no $flag" >&2; exit 1; }
          done

      - name: Upload the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: ${{ runner.temp }}/archives/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [release-please, build]
    if: needs.release-please.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # upload assets to the draft release and publish it
      id-token: write # sign the attestations with the workflow identity
      attestations: write # store the attestations in this repository
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/downloads

      - name: Package deterministically
        shell: bash
        run: scripts/release/package-release.sh "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/archives" "$RUNNER_TEMP/subjects"

      - name: Attest the archives and the binaries
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/archives/env-vault-*.tar.gz
            ${{ runner.temp }}/archives/env-vault-*.zip
            ${{ runner.temp }}/subjects/env-vault-*

      - name: Verify the attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/archives/env-vault-*.{tar.gz,zip} "$RUNNER_TEMP"/subjects/env-vault-*; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$RELEASE_SHA" \
              --deny-self-hosted-runners > /dev/null
            echo "attestation verified: $(basename "$file")"
          done

      - name: Upload to the draft release and publish it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [[ "$draft" == "true" ]] || { echo "release $RELEASE_TAG is not a draft" >&2; exit 1; }
          # A re-run may find assets from an earlier attempt: keep them only if
          # their bytes are identical, and never replace them.
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          declare -A uploaded=()
          while IFS= read -r name; do
            [[ -z "$name" ]] || uploaded["$name"]=1
          done <<< "$names"
          existing="$RUNNER_TEMP/existing"
          mkdir "$existing"
          pending=()
          for file in "$RUNNER_TEMP"/archives/*; do
            name="$(basename "$file")"
            if [[ -n "${uploaded[$name]:-}" ]]; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$existing"
              cmp -s "$file" "$existing/$name" || { echo "$name already exists with different bytes" >&2; exit 1; }
            else
              pending+=("$file")
            fi
          done
          if (( ${#pending[@]} > 0 )); then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${pending[@]}"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $RELEASE_TAG"

  verify:
    name: verify
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # read the attestations that gh verifies
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - name: Verify the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e '.draft == false and .immutable == true' <<< "$release" > /dev/null ||
            { echo "release $RELEASE_TAG is not published as an immutable release" >&2; exit 1; }
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$tagged" == "$RELEASE_SHA" ]] ||
            { echo "tag $RELEASE_TAG points to $tagged, not $RELEASE_SHA" >&2; exit 1; }
          published="$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$published"
          expected=""
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            archive="env-vault-$target.tar.gz"
            [[ "$target" == windows-* ]] && archive="env-vault-$target.zip"
            expected+="$archive"$'\n'"$archive.sha256"$'\n'
          done
          diff <(LC_ALL=C sort <<< "${expected%$'\n'}") <(cd "$published" && ls -1 | LC_ALL=C sort) ||
            { echo "the published assets differ from the expected ten" >&2; exit 1; }
          cd "$published"
          sha256sum -c ./*.sha256
          for archive in env-vault-*.tar.gz env-vault-*.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$RELEASE_SHA" \
              --deny-self-hosted-runners > /dev/null
            echo "attestation verified: $archive"
          done

  tap:
    name: tap
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      TAP_REPOSITORY: ildarbinanas-design/homebrew-tap
      FORMULA_PATH: Formula/env-vault.rb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Generate the formula from the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
              --pattern "env-vault-$target.tar.gz" --pattern "env-vault-$target.tar.gz.sha256"
          done
          scripts/release/homebrew-formula.sh "$RELEASE_TAG" "$assets" "$RUNNER_TEMP/env-vault.rb"

      # The tap's ruleset requires its `test` check, which also compares every
      # url and sha256 with the published checksums. Auto-merge waits for it.
      - name: Open the tap pull request with auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          formula="$RUNNER_TEMP/env-vault.rb"
          branch="env-vault-$RELEASE_TAG"
          current="$RUNNER_TEMP/current.rb"
          gh api "repos/$TAP_REPOSITORY/contents/$FORMULA_PATH?ref=main" --jq .content | base64 -d > "$current"
          if cmp -s "$formula" "$current"; then
            echo "the tap already has the $RELEASE_TAG formula"
            exit 0
          fi
          if gh api "repos/$TAP_REPOSITORY/branches/$branch" > /dev/null 2>&1; then
            # A re-run finds the branch from an earlier attempt.
            gh api "repos/$TAP_REPOSITORY/contents/$FORMULA_PATH?ref=$branch" --jq .content | base64 -d > "$current"
            cmp -s "$formula" "$current" ||
              { echo "tap branch $branch exists with a different formula" >&2; exit 1; }
          else
            base="$(gh api "repos/$TAP_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            blob="$(gh api "repos/$TAP_REPOSITORY/contents/$FORMULA_PATH?ref=$base" --jq .sha)"
            gh api --method POST "repos/$TAP_REPOSITORY/git/refs" \
              -f "ref=refs/heads/$branch" -f "sha=$base" > /dev/null
            gh api --method PUT "repos/$TAP_REPOSITORY/contents/$FORMULA_PATH" \
              -f "message=env-vault $RELEASE_TAG" -f "branch=$branch" -f "sha=$blob" \
              -f "content=$(base64 -w0 "$formula")" > /dev/null
          fi
          state="$(gh pr view "$branch" --repo "$TAP_REPOSITORY" --json state --jq .state 2>/dev/null || true)"
          if [[ -z "$state" ]]; then
            gh pr create --repo "$TAP_REPOSITORY" --base main --head "$branch" \
              --title "env-vault $RELEASE_TAG" \
              --body "Updates the env-vault formula to $RELEASE_TAG. The env-vault release workflow generated it from the published release. Auto-merge waits for the \`test\` check."
            state=OPEN
          fi
          case "$state" in
            OPEN) gh pr merge "$branch" --repo "$TAP_REPOSITORY" --auto --squash ;;
            MERGED) echo "the tap pull request is already merged" ;;
            *) echo "tap pull request for $branch is $state" >&2; exit 1 ;;
          esac
