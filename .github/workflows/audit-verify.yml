# Temporary audit verification workflow (Standing Delegation: claude/verify-*).
# Triggers only on this branch; read-only token; no secrets; prints only
# non-secret results. The branch is deleted when the audit is done.
name: audit-verify
on:
  push:
    branches:
      - claude/verify-audit-20260926
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  BASE_SHA: 8c6591f3a267b1133d446768b5f0b95e0cef42f8
  PR_SHA: ce536d3c19bda1d9463e8b5ed857c54a6f7ceb99

jobs:
  signals:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_SHA }}
          path: pr
          persist-credentials: "false"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: "false"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: pr/go.mod
          cache: false
      - name: Unit tests of the PR head (race, 3 runs)
        shell: bash
        working-directory: pr
        run: go test -race -count=3 ./internal/runner/... ./internal/cli/...
      - name: Build main and the PR head
        shell: bash
        run: |
          set -euo pipefail
          (cd base && go build -o "$RUNNER_TEMP/ev-main" ./cmd/env-vault)
          (cd pr && go build -o "$RUNNER_TEMP/ev-pr" ./cmd/env-vault)
      - name: Terminal Ctrl+C in a shell loop
        shell: bash
        run: |
          python3 .github/audit-verify/pty_loop.py "$RUNNER_TEMP/ev-main" "$RUNNER_TEMP/ev-pr"
          python3 .github/audit-verify/pty_count.py "$RUNNER_TEMP/ev-main" "$RUNNER_TEMP/ev-pr"
      - name: Signals sent without a terminal
        shell: bash
        run: python3 .github/audit-verify/notty.py "$RUNNER_TEMP/ev-main" "$RUNNER_TEMP/ev-pr"
