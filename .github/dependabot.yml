version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # ADR 0011: a dependency update ships in a release, so it is a fix.
    commit-message:
      prefix: "fix"
      include: "scope"
    # Keep dependency requirements unchanged when they already admit an update.
    # Dependencies that commonly raise the minimum Go version stay out of the
    # broad group so their toolchain impact is reviewed in an isolated PR.
    # golang.org/x/crypto is excluded too: each release requires the latest
    # golang.org/x/sys and golang.org/x/term and would pull them back in.
    versioning-strategy: "increase-if-necessary"
    groups:
      go-modules-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/gofrs/flock"
          - "golang.org/x/crypto"
          - "golang.org/x/term"
          - "golang.org/x/sys"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # ADR 0011: an Actions update changes only CI, so it creates no release.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
